AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Red Neuronal Segmentada - Datos

Resources:
  FuncionDatos:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: funcion-datos
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          S3_BUCKET_NAME: red-neuronal-segmentada-modelos
      Policies:
        - S3WritePolicy:
            BucketName: red-neuronal-segmentada-modelos
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - "GET"
            - "POST"
