AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Red Neuronal Segmentada - Prediccion

Resources:
  FuncionPrediccion:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: funcion-prediccion
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          S3_BUCKET_NAME: "red-neuronal-segmentada-modelos"
          TRAINED_KEY:    "modelo_entrenado.h5"
          CONTAINER_PREDICT_URL: "<TENSORFLOW_CONTAINER_URL>/predict-model"
      Policies:
        - S3ReadPolicy:
            BucketName: red-neuronal-segmentada-modelos
      FunctionUrlConfig:
        AuthType: NONE
