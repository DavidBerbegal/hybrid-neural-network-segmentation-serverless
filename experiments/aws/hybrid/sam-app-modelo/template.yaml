AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Red Neuronal Hibrida - Modelo

Parameters:
  InputLayerUrl:
    Type: String
    Description: URL de la funcion de capa de entrada

  HiddenLayerUrl:
    Type: String
    Description: URL de la funcion de capa oculta

  OutputLayerUrl:
    Type: String
    Description: URL de la funcion de capa de salida

  ContainerConfigUrl:
    Type: String
    Description: URL del contenedor con la ruta /configure-layer

  ModelBucketName:
    Type: String
    Description: Bucket S3 existente para datos y modelos

Resources:
  FuncionModelo:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: funcion-modelo
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      PackageType: Zip
      CodeUri: .
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 900
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          URL_CAPA_ENTRADA: !Ref InputLayerUrl
          URL_CAPA_OCULTA: !Ref HiddenLayerUrl
          URL_CAPA_SALIDA: !Ref OutputLayerUrl
          URL_CONTENEDOR_CONFIG: !Ref ContainerConfigUrl
          S3_BUCKET_NAME: !Ref ModelBucketName
          S3_KEY_H5: modelo_sin_entrenar.h5
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ModelBucketName
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  FunctionName:
    Value: !Ref FuncionModelo

  FunctionUrl:
    Value: !GetAtt FuncionModeloUrl.FunctionUrl