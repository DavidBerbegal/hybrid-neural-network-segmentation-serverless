AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Red Neuronal Hibrida - Prediccion

Parameters:
  ModelBucketName:
    Type: String
    Description: Bucket S3 existente para datos y modelos

  ContainerPredictUrl:
    Type: String
    Description: URL del contenedor con la ruta /predict-model

Resources:
  FuncionPrediccion:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: funcion-prediccion
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      PackageType: Zip
      CodeUri: .
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 900
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref ModelBucketName
          TRAINED_KEY: modelo_entrenado.h5
          CONTAINER_PREDICT_URL: !Ref ContainerPredictUrl
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ModelBucketName
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  FunctionName:
    Value: !Ref FuncionPrediccion

  FunctionUrl:
    Value: !GetAtt FuncionPrediccionUrl.FunctionUrl